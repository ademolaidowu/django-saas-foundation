[project]
name = "django-saas-foundation"
version = "0.1.0"
description = "A reusable Django SaaS foundation with multi-tenancy, account-scoped authentication, RBAC, audit trails, and tenant-isolated APIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "django-split-settings>=1.3",
    "uuid-utils>=0.9",
    "psycopg[binary]>=3.2",
    "django-rest-knox>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "model-bakery>=1.19",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 119
target-version = "py312"
respect-gitignore = true
include = ["*.py"]
exclude = [
    "**/migrations/*",
    ".git",
    ".mypy_cache",
    "__pycache__",
    "venv",
    ".venv",
]
src = ["apps", "config"]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "C90",
    "B",
    "A",
    "C",
    "Q",
    "UP",
]
ignore = [
    "A003", "A005", "B904", "Q000",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config/settings/[!_]*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "split_settings.*", "environ.*", "knox.*"]
ignore_missing_imports = true

# split-settings injects globals (`env`, cross-file names) at include time;
# static analysis of these files produces false positives.
[[tool.mypy.overrides]]
module = ["config.settings.*"]
ignore_errors = true

# Migrations use custom settings symbols (KNOX_TOKEN_MODEL) that django-stubs
# can't see; the file is auto-generated anyway.
[[tool.mypy.overrides]]
module = ["accounts.migrations.*", "tenants.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "*/admin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]
